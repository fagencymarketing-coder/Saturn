<!-- Оформление штатной формы Tilda под дизайн «Сатурна».
     Блок T123 ставится ПОД блоком формы.
     В настройках блока формы задать CSS-класс: uc-saturn-form -->
<style>
/* было 128px снизу — под формой зияла пустая полоса в треть экрана,
   из-за неё подвал выглядел оторванным. Заказчик заметил 03.10.2026. */
.uc-saturn-form{background:#141210;padding:0 0 56px}
.uc-saturn-form .t-container,
.uc-saturn-form .t-col{font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif}

/* Карточка формы. Раньше на ПК формы просто не было видно: прозрачные
   поля с рамкой в 15% белого на почти чёрном фоне читались как пустота.
   Теперь форма стоит на своей подложке — так она отделяется от страницы
   и сразу видно, что это форма. Заказчик заметил 04.10.2026. */
.uc-saturn-form .t-form{background:#1E1B18;border-radius:22px;padding:28px}
.uc-saturn-form .t-input-group{margin-bottom:12px}

/* поля: кегль ровно 16 — иначе Safari на iPhone приближает страницу */
.uc-saturn-form .t-input,
.uc-saturn-form input.t-input,
.uc-saturn-form textarea.t-input{
  height:52px !important;border-radius:12px !important;padding:0 18px !important;
  background:rgba(255,255,255,.05) !important;
  border:1px solid rgba(255,255,255,.28) !important;
  color:#fff !important;font-size:16px !important;font-weight:500 !important;
  font-family:Montserrat,sans-serif !important}
.uc-saturn-form .t-input::placeholder{color:rgba(255,255,255,.55) !important}
/* Виджет телефона Тильды рисует флаг и код отдельными элементами, мимо
   .t-input, и на тёмном фоне они оставались светлыми пятнами. */
.uc-saturn-form .t-inputphonemask__wrap,
.uc-saturn-form .t-inputphonemask__select{
  background:rgba(255,255,255,.05) !important;
  border:1px solid rgba(255,255,255,.28) !important;
  border-radius:12px !important;height:52px !important;color:#fff !important}
.uc-saturn-form .t-inputphonemask__options{background:#1E1B18 !important;color:#fff !important;
  border:1px solid rgba(255,255,255,.2) !important;border-radius:12px !important}
.uc-saturn-form .t-inputphonemask__option:hover{background:rgba(255,255,255,.08) !important}
.uc-saturn-form .t-input:focus{border-color:#FF4200 !important;outline:none !important}

/* текст согласия */
.uc-saturn-form .t-checkbox__control,
.uc-saturn-form .t-checkbox__indicator+span,
.uc-saturn-form .t-form__lock-text,
.uc-saturn-form .t-form__screen-descr{
  font-size:13px !important;font-weight:400 !important;line-height:19.5px !important;
  color:rgba(255,255,255,.6) !important}
.uc-saturn-form .t-checkbox__control a,
.uc-saturn-form .t-form__lock-text a{color:#fff !important;text-decoration:underline}
.uc-saturn-form .t-checkbox__indicator{border-radius:4px !important;width:18px !important;
  height:18px !important;border:1px solid rgba(255,255,255,.3) !important}
.uc-saturn-form .t-checkbox:checked+.t-checkbox__indicator,
.uc-saturn-form .t-checkbox__indicator_checked{background:#FF4200 !important;
  border-color:#FF4200 !important}

/* кнопка */
.uc-saturn-form .t-submit{
  height:52px !important;border-radius:12px !important;background:#D93800 !important;
  color:#fff !important;font-size:16px !important;font-weight:700 !important;
  font-family:Montserrat,sans-serif !important;border:0 !important;
  transition:background .15s}
.uc-saturn-form .t-submit:hover{background:#C23100 !important}
/* Пока согласие не отмечено, кнопка приглушена — но остаётся оранжевой
   и читается как кнопка. Серая #2A2A2A на тёмном фоне пропадала совсем,
   и главное действие страницы выглядело сломанным. */
.uc-saturn-form .t-submit.sa-off{background:#6B2410 !important;
  color:rgba(255,255,255,.7) !important;cursor:not-allowed}

/* сообщение после отправки */
.uc-saturn-form .t-form__successbox{background:#1E1B18 !important;color:#fff !important;
  border-radius:22px !important;font-family:Montserrat,sans-serif !important}

@media (max-width:1023px){
  .uc-saturn-form{padding-bottom:96px}
  .uc-saturn-form .t-form{padding:24px}
}
@media (max-width:767px){
  .uc-saturn-form{padding-bottom:72px}
  .uc-saturn-form .t-form{padding:20px}
}
</style>

<script>
(function(){
  function wire(){
    document.querySelectorAll('.uc-saturn-form form').forEach(function(f){
      if(f.dataset.saWired) return;
      var cb = f.querySelector('input[type=checkbox]');
      var btn = f.querySelector('.t-submit');
      if(!cb || !btn) return;
      f.dataset.saWired = '1';
      function sync(){ btn.classList.toggle('sa-off', !cb.checked); }
      cb.addEventListener('change', sync);
      sync();
    });
  }
  wire();
  document.addEventListener('DOMContentLoaded', wire);
  window.addEventListener('load', wire);
  new MutationObserver(wire).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
