<!-- Блок «Шапка» для вставки в T123 на странице-шаблоне «Шапка» -->
<style>
.sa-hd{--ink:#141210;--acc:#FF4200;
  font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;
  position:fixed;top:0;left:0;right:0;z-index:9000;background:var(--ink)}
.sa-hd *{box-sizing:border-box;margin:0;padding:0}
.sa-hd__in{max-width:1200px;margin:0 auto;padding:24px 20px;height:85px;
  display:flex;align-items:center}
.sa-hd__logo{display:block;flex:0 0 auto}
.sa-hd__logo img{display:block;width:103px;height:36px;object-fit:contain}
.sa-hd__nav{display:flex;align-items:center;gap:32px;margin-left:48px}
.sa-hd__nav a{font-size:15px;font-weight:600;color:rgba(255,255,255,.6);
  text-decoration:none;white-space:nowrap}
.sa-hd__right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end}
.sa-hd__tel{font-size:16px;font-weight:700;color:#fff;text-decoration:none;white-space:nowrap}
.sa-hd__mail{font-size:14px;font-weight:500;color:rgba(255,255,255,.6);
  text-decoration:none;margin-top:2px;white-space:nowrap}
.sa-hd__icons{display:none;margin-left:auto;gap:4px}
.sa-hd__ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:none;border:0;cursor:pointer;color:#fff;text-decoration:none}
.sa-hd__ib svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.sa-hd__sp{height:85px}
/* оверлей-меню */
.sa-hd__ov{position:fixed;inset:0;z-index:9001;background:#141210;
  font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;
  display:none;flex-direction:column;padding:0 20px 40px;overflow-y:auto}
.sa-hd__ov *{box-sizing:border-box;margin:0;padding:0}
.sa-hd__ov.is-open{display:flex}
.sa-hd__ovtop{height:64px;display:flex;align-items:center;flex:0 0 auto;
  padding:10px 0;margin:0 -20px 0 0;padding-right:0}
.sa-hd__ovtop img{display:block;width:80px;height:28px;object-fit:contain}
.sa-hd__ovtop .sa-hd__ib{margin-left:auto}
.sa-hd__ovnav{display:flex;flex-direction:column;margin-top:24px}
.sa-hd__ovnav a{font-size:24px;font-weight:700;color:#fff;text-decoration:none;
  padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.sa-hd__ovc{margin-top:32px;display:flex;flex-direction:column;gap:4px}
.sa-hd__ovc a{color:#fff;text-decoration:none;min-height:44px;display:flex;
  align-items:center;font-size:17px;font-weight:700}
.sa-hd__ovc a.sa-hd__ovm{font-size:15px;font-weight:500;color:rgba(255,255,255,.6)}
@media (hover:hover){
  .sa-hd__nav a:hover{color:#fff}
  .sa-hd__tel:hover,.sa-hd__mail:hover{color:var(--acc)}
  .sa-hd__ovnav a:hover{color:#FF4200}
}
@media (max-width:959px){
  .sa-hd__nav{gap:24px;margin-left:32px}
  .sa-hd__nav a{font-size:14px}
}
@media (max-width:767px){
  .sa-hd__in{height:64px;padding:10px 20px}
  .sa-hd__logo img{width:80px;height:28px}
  .sa-hd__nav,.sa-hd__right{display:none}
  .sa-hd__icons{display:flex}
  .sa-hd__sp{height:64px}
}
/* якоря: закреплённая шапка не должна перекрывать заголовок секции */
html{scroll-behavior:smooth}
#seeds,#service,#contacts,#geo,#docs,#results{scroll-margin-top:85px}
@media (max-width:767px){
  #seeds,#service,#contacts,#geo,#docs,#results{scroll-margin-top:64px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<div class="sa-hd">
  <div class="sa-hd__in">
    <a class="sa-hd__logo" href="/" aria-label="Сатурн — на главную"><img src="https://raw.githubusercontent.com/fagencymarketing-coder/Saturnphoto/main/files/saturn-logo-white.png" alt="Сатурн"></a>
    <nav class="sa-hd__nav">
      <a href="/catalog">Каталог</a>
      <a href="/#seeds">Семена</a>
      <a href="/#service">Агросопровождение</a>
      <a href="/#contacts">Контакты</a>
    </nav>
    <div class="sa-hd__right">

    </div>
    <div class="sa-hd__icons">
      <a class="sa-hd__ib" href="mailto:nilov@sssaturn.ru" aria-label="Написать на почту"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/></svg></a>
      <a class="sa-hd__ib" href="tel:+79609534888" aria-label="Позвонить"><svg viewBox="0 0 24 24"><path d="M5 3h3l2 5-2.5 1.5a12 12 0 0 0 6 6L15 13l5 2v3a2 2 0 0 1-2.2 2A17 17 0 0 1 3 5.2 2 2 0 0 1 5 3z"/></svg></a>
      <button class="sa-hd__ib" type="button" aria-label="Открыть меню" onclick="document.getElementById('sa-hd-ov').classList.add('is-open');document.documentElement.style.overflow='hidden'"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    </div>
  </div>
</div>
<div class="sa-hd__sp"></div>

  <div class="sa-hd__ovtop">
    <img src="https://raw.githubusercontent.com/fagencymarketing-coder/Saturnphoto/main/files/saturn-logo-white.png" alt="Сатурн">
    <button class="sa-hd__ib" type="button" aria-label="Закрыть меню" onclick="document.getElementById('sa-hd-ov').classList.remove('is-open');document.documentElement.style.overflow=''"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <nav class="sa-hd__ovnav" onclick="document.getElementById('sa-hd-ov').classList.remove('is-open');document.documentElement.style.overflow=''">
