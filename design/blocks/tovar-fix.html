<!-- Сатурн: страница товара /<страница>/tproduct/<id>.
     Холст: design/maket/holst-tovar.png — два состояния, «с фото упаковки»
     (две колонки) и «без фото — одна колонка, 720».

     Tilda отдаёт здесь ту же разметку, что во всплывающей карточке
     каталога ST340F: префикс классов t-catalog__prod-popup__*. Своей
     вёрстки у страницы нет, поэтому переодеваем её целиком — но не
     переписываем: ни один узел Тильды не удаляется, кроме плоского
     списка характеристик, который мы пересобираем в таблицу из его же
     текста.

     Файл попадает в «Настройки сайта → Вставка кода → HEAD» через
     tools/build_head_code.py, отдельным блоком его ставить не нужно. -->

<style>
/* ===== Страница товара ==================================================
   Правила ниже включаются только там, где на странице есть карточка
   товара: признак — контейнер .t-catalog__prod-snippet__container.,
   товара: признак — контейнер .t-catalog__prod-popup__container.
   На каталоге и главной его нет, поэтому ничего не заденет.
   ======================================================================== */

/* 1. Фон страницы. На холсте карточка белая и лежит на фоне, а не
      сливается с ним. Tilda ставит белый фон и телу, и записи блока,
      поэтому карточка на живой странице читалась как «просто текст
      посреди пустоты». Возвращаем тёплый фон сайта — тот же, что под
      карточками в каталоге. */
body:has(.t-catalog__prod-snippet__container),
body:has(.t-catalog__prod-popup__container){background:#F7F5F2 !important}
.t-rec:has(> .t-catalog__prod-snippet__container),
.t-rec:has(> .t-catalog__prod-popup__container){background:#F7F5F2 !important}

/* 2. Ширина и поля — как у всех блоков сайта. */
.t-catalog__prod-snippet__container,
.t-catalog__prod-popup__container{
  max-width:min(1240px,90vw) !important;
  margin:0 auto !important;
  padding:clamp(18px,2.6vh,28px) 0 clamp(40px,6vh,64px) !important;
  position:relative}

/* 3. Возврат в каталог. Tilda рисует два выхода разом: крестик поверх
      страницы (он от всплывающего окна, на отдельной странице читается
      как «закрыть сайт») и ссылку «Все товары», прижатую абсолютом в
      левый верхний угол. Крестик убираем, ссылку ставим в поток первой
      строкой и даём ей стрелку назад. */
.t-catalog__prod-snippet__container .t-popup__close,
.t-catalog__prod-popup__container .t-popup__close{display:none !important}
.t-catalog__prod-popup__close-txt-wr{
  position:static !important;margin:0 0 clamp(12px,2vh,18px) !important}
a.js-catalog-close-text{
  position:relative;display:inline-flex;align-items:center;gap:8px;
  font-size:var(--sa-small) !important;color:#6B655E !important;
  text-decoration:none !important;
  transition:color var(--sa-t) var(--sa-ease)}
a.js-catalog-close-text::before{content:"←";font-size:15px;line-height:1}
/* ссылка высотой 19 px — палец мимо неё не попадёт, поэтому зона нажатия
   растянута прозрачным ::after, как у ссылок подвала */
a.js-catalog-close-text::after{content:"";position:absolute;inset:-13px -10px}
@media (hover:hover){a.js-catalog-close-text:hover{color:#141210 !important}}

/* 4. Сама карточка. box-sizing обязателен: к ширине 100% мы добавляем
      свои поля, а у Тильды в этой ветке разметки блоки считаются по
      content-box — на телефоне карточка вылезала за экран на 55 px. */
.t-catalog__prod-snippet__container,
.t-catalog__prod-popup__container,
.t-catalog__prod-snippet__container *,
.t-catalog__prod-popup__container *{box-sizing:border-box}
.t-catalog__product-snippet .t-container,
.t-catalog__product-popup .t-container{
  width:100% !important;max-width:none !important;
  background:#fff;border-radius:var(--sa-r-card);
  padding:clamp(18px,2.4vw,32px);
  box-shadow:0 1px 2px rgba(20,18,16,.04),0 14px 44px rgba(20,18,16,.07)}

/* 5. Две колонки. У Тильды колонки — это t-col_6 с процентной шириной и
      полями, из-за них описание уходило под фотографию, а правая половина
      экрана оставалась пустой. Переводим на сетку.

      Второе состояние холста — товар без фотографии. Признак берём из
      самой разметки: Tilda пишет <meta itemprop="image" content=""> с
      пустым значением. Тогда колонка с фото не нужна вовсе, а текст
      становится одной колонкой шириной 720, как на холсте 1b. Пустой
      бежевый прямоугольник в полэкрана не показываем. */
.t-catalog__product-snippet .t-catalog__prod-popup__col-left,
.t-catalog__product-popup .t-catalog__prod-popup__col-left,
.t-catalog__product-snippet .t-catalog__prod-popup__col-right,
.t-catalog__product-popup .t-catalog__prod-popup__col-right{
  width:auto !important;max-width:none !important;
  margin:0 !important;padding:0 !important;float:none !important}
.t-catalog__product-snippet .t-catalog__prod-popup__col-left,
.t-catalog__product-popup .t-catalog__prod-popup__col-left{
  background:#F0EDE9 url("https://static.tildacdn.com/tild3762-3461-4635-b161-643835316538/saturn-emblem.png")
    center / 64px auto no-repeat;
  border-radius:18px;overflow:hidden}
/* Эмблема лежит на самой колонке, а фотография — на вложенном блоке
   поверх неё. Пока снимок грузится, место занято знаком, а не пустым
   серым прямоугольником; загрузился — закрыл собой всё.

   05.10.2026, ошибка в четырёх правилах «без фото» ниже: в списке
   селекторов у первой половины не было хвоста (.t-container, колонка
   и т.д.), он стоял только у второй. Из-за этого на отдельной
   странице товара без снимка правило .t-catalog__product-snippet:has(…)
   {display:none} прятало ВСЮ карточку, и человек видел пустую страницу
   с одной ссылкой «Все товары». Шести товарам из 111: Зазофен,
   Relict Макро N Mg+, Relict Макро PK, Микроэл Пивоваренный ячмень,
   Атлант Супер, Вега Клей. Хвост достроен у всех четырёх правил. */
.t-catalog__product-snippet:has(meta[itemprop="image"][content=""]) .t-catalog__prod-popup__col-left,
.t-catalog__product-popup:has(meta[itemprop="image"][content=""])
  .t-catalog__prod-popup__col-left{display:none !important}

@media screen and (min-width:960px){
  /* Описание и характеристики длиннее фотографии, и под снимком
     оставалась пустая половина карточки высотой с экран. Колонка со
     снимком едет вместе с прокруткой: фотография остаётся перед
     глазами, пока читают состав и нормы, а пустоты нет. */
  .t-catalog__product-snippet .t-catalog__prod-popup__col-left,
  .t-catalog__product-popup .t-catalog__prod-popup__col-left{
    position:sticky;top:104px}
  .t-catalog__product-snippet .t-container > div,
  .t-catalog__product-popup .t-container > div,
  /* В попапе (клик по плитке в каталоге) колонки лежат не в
     .t-container > div, как на странице товара, а прямо в
     .t-container_fluid — другая обёртка Тильды. Без сетки здесь
     фото-колонка (sticky) схлопывалась в ноль, а текст и фотография
     наезжали друг на друга (фото уходило под текст фоном). Ловим
     именно тот контейнер, где лежит колонка с фото.
     06.10: та же обёртка .t-container_fluid оказалась и на ОТДЕЛЬНОЙ
     странице товара (разметка у страницы и попапа одна). Сетка ловила
     её только у попапа, поэтому на странице колонки шли дефолтными
     флоатами Тильды: текст растягивался на всю карточку и вставал выше
     фото. Добавлен тот же селектор для .t-catalog__product-snippet. */
  .t-catalog__product-snippet .t-container_fluid:has(> .t-catalog__prod-popup__col-left),
  .t-catalog__product-popup .t-container_fluid:has(> .t-catalog__prod-popup__col-left){
    display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);
    align-items:start;column-gap:clamp(28px,3vw,44px);row-gap:0}
  /* Кроме двух колонок Tilda кладёт сюда ещё и свои крошки — пустой
     блок нулевой высоты. Без явного места он занимал первую ячейку,
     фотография уезжала во вторую, а описание падало на строку ниже:
     ровно то, что было видно на живой странице. */
  .t-catalog__product-snippet .t-catalog__prod-popup__breadcrumbs,
  .t-catalog__product-popup .t-catalog__prod-popup__breadcrumbs{
    grid-column:1 / -1}
  .t-catalog__product-snippet .t-catalog__prod-popup__col-left,
  .t-catalog__product-popup .t-catalog__prod-popup__col-left{grid-column:1}
  .t-catalog__product-snippet .t-catalog__prod-popup__col-right,
  .t-catalog__product-popup .t-catalog__prod-popup__col-right{grid-column:2}
  /* без фотографии сужается сама карточка, а не текст внутри широкой:
     на холсте 1b это карточка 720, стоящая по центру страницы */
  .t-catalog__product-snippet:has(meta[itemprop="image"][content=""]) .t-container,
  .t-catalog__product-popup:has(meta[itemprop="image"][content=""])
    .t-container{max-width:calc(720px + 2 * clamp(18px,2.4vw,32px)) !important;
    margin:0 auto}
  .t-catalog__product-snippet:has(meta[itemprop="image"][content=""]) .t-container > div,
  .t-catalog__product-popup:has(meta[itemprop="image"][content=""])
    .t-container > div,
  .t-catalog__product-snippet:has(meta[itemprop="image"][content=""]) .t-container_fluid:has(> .t-catalog__prod-popup__col-right),
  .t-catalog__product-popup:has(meta[itemprop="image"][content=""]) .t-container_fluid:has(> .t-catalog__prod-popup__col-right){grid-template-columns:minmax(0,1fr)}
  .t-catalog__product-snippet:has(meta[itemprop="image"][content=""]) .t-catalog__prod-popup__col-right,
  .t-catalog__product-popup:has(meta[itemprop="image"][content=""])
    .t-catalog__prod-popup__col-right{grid-column:1}
}
@media screen and (max-width:959px){
  .t-catalog__product-snippet .t-catalog__prod-popup__col-right,
  .t-catalog__product-popup .t-catalog__prod-popup__col-right{
    margin-top:clamp(18px,3vh,26px) !important}
}

/* 6. Заголовок, раздел, артикул. Раздел — та самая плашка с холста;
      откуда берётся текст, написано в скрипте ниже. */
.sa-tp__cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.sa-tp__cat{display:inline-block;background:#F0EDE9;color:#6B655E;
  font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.2;
  font-size:var(--sa-kick);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:7px 14px;border-radius:var(--sa-r-pill)}
/* вторая плашка на холсте обведённая, а не залитая: так видно, что
   это не второй раздел, а уточнение к первому — «гибрид F1», «РС 1» */
/* A4 05.10: плашки одной заливкой — контурная выглядела как другой тип элемента */
.sa-tp__cat--out{background:#F0EDE9;box-shadow:none}
h1.t-catalog__prod-popup__name{
  font-size:var(--sa-h2) !important;font-weight:800 !important;
  line-height:var(--sa-h2-lh) !important;color:#141210 !important;
  margin:0 !important;letter-spacing:-.01em}
.t-catalog__prod-popup__brand{
  font-size:var(--sa-body) !important;color:#4A453F !important;
  margin-top:8px !important}
.t-catalog__prod-popup__brand:empty{display:none}
/* 06.10 (заказчица): у семян бренд-подпись под названием не нужна —
   на эталоне семян её нет (это и была обведённая строка «KWS» под
   «КВС Аквилон»). У удобрений подпись («Фертика») остаётся. */
.sa-tp--semena .t-catalog__prod-popup__brand{display:none !important}
/* Артикул убран по решению заказчицы 04.10: покупателю он ничего не
   говорит, а строка «fertika-listovoe-18-18-18» под названием
   выглядит как служебная запись. В разметке он остаётся — поисковики
   читают его из itemprop="sku". */
.t-catalog__prod-popup__sku{display:none !important}
/* Производителя больше не прячем. Раньше строка «Фертика» под
   «FERTIKA Листовое» считалась повтором, но на холсте 1a она стоит:
   это подпись к названию, и без неё заголовок висит в воздухе.
   У СЗР производителя в магазине нет — туда скрипт ставит
   действующее вещество, как на холсте 1b. */

/* 7. Описание. Длина строки ограничена: на широком мониторе правая
      колонка — это 700 px, и строка в 120 знаков читается плохо. */
.js-catalog-prod-text{
  font-size:var(--sa-body) !important;line-height:1.55 !important;
  color:#2E2A26 !important;margin-top:clamp(14px,2vh,18px) !important}
.js-catalog-prod-all-text{max-width:60ch}

/* 8. Цена. Было: серая строка тем же кеглем, что и всё остальное, да
      ещё и над описанием — а в самом описании ниже стояла вторая цена,
      текстом. Две цены подряд, одна без единицы измерения.

      Единица хранится только в описании: «Цена: от 585 ₽/л. При 100%
      предоплате, доставка и хранение включены». Так заполнены ровно те
      74 позиции из 112, у которых цена есть в магазине — проверено по
      выгрузке, совпадение полное. Поэтому строку цены собираем из этого
      предложения: число крупно, единица тише, условие продажи под ними.
      Ничего не придумываем — ни «от», ни «за кг»: что написано у
      позиции, то и показываем. Штатную строку Тильды прячем только
      после того, как своя собралась. */
.t-catalog__product-snippet .js-catalog-price-wrapper,
.t-catalog__product-popup .js-catalog-price-wrapper{
  margin:clamp(16px,2.4vh,22px) 0 0 !important}
.t-catalog__prod-popup__price{
  display:flex !important;align-items:baseline;gap:7px;margin:0 !important}
.t-catalog__prod-popup__price-value{
  font-size:var(--sa-h2) !important;font-weight:800 !important;
  line-height:1 !important;color:#141210 !important;letter-spacing:-.015em}
.t-catalog__prod-popup__price-currency{
  font-size:var(--sa-body) !important;font-weight:500 !important;
  color:#6B655E !important}
.sa-tp--own-price .js-catalog-price-wrapper{display:none !important}

.sa-tp__price{display:flex;align-items:baseline;gap:7px;
  margin-top:clamp(16px,2.4vh,22px)}
.sa-tp__ot{font-size:var(--sa-small);color:#8A837B}
.sa-tp__num{font-size:var(--sa-h2);font-weight:800;line-height:1;
  color:#141210;letter-spacing:-.015em}
.sa-tp__unit{font-size:var(--sa-body);font-weight:500;color:#6B655E}
.sa-tp__note{font-size:var(--sa-small);line-height:1.45;color:#8A837B;
  margin-top:9px;max-width:46ch}

/* 9. Характеристики. У Тильды это абзацы «Культура: Рапс» подряд —
      шесть серых строк, в которых не видно, где название, а где
      значение. На холсте это таблица в две колонки с тонкими
      разделителями. Разметку собирает скрипт, здесь только вид. */
.sa-tp__chars{margin-top:clamp(18px,2.8vh,26px);border-top:1px solid #E6E1DB}
.sa-tp__row{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);
  gap:16px;padding:13px 0;border-bottom:1px solid #E6E1DB}
/* 06.10 (заказчица): «цвет текста в карточке бледный». Насыщаем —
   метки темнее (#4A453F вместо #6B655E), значения тёмные с !important,
   чтобы дефолтный светлый цвет Тильды на отдельной странице товара их
   не перебивал. */
.sa-tp__k{font-size:var(--sa-body);line-height:1.5;color:#4A453F !important}
.sa-tp__v{font-size:var(--sa-body);line-height:1.5;color:#141210 !important}
@media screen and (max-width:599px){
  .sa-tp__row{grid-template-columns:minmax(0,1fr);gap:3px;padding:12px 0}
  .sa-tp__k{font-size:var(--sa-small)}
}

/* 9a. 06.10: строку-источник под таблицей убрали (эталон — перечёркнута).
       На всякий случай прячем, если где-то осталась в кеше. */
.sa-tp__src{display:none !important}

/* 9b. Фотография. У препарата это упаковка на светлой подложке —
       её нельзя обрезать, поэтому вписываем целиком. У семян это
       снимок поля: его, наоборот, надо заполнить кадром, иначе
       внутри квадрата остаются поля и карточка выглядит пустой. */
.sa-tp--semena .t-catalog__prod-popup__col-left .t-img,
.sa-tp--semena .t-catalog__prod-popup__col-left img.js-product-img,
.sa-tp--photo .t-catalog__prod-popup__col-left .t-img,
.sa-tp--photo .t-catalog__prod-popup__col-left img.js-product-img{
  width:100% !important;aspect-ratio:1/1;object-fit:cover;
  border-radius:var(--sa-r-card)}

/* 10. Кнопки. Пара с холста: заявка и прайс. */
.sa-tp__btns{display:flex;align-items:center;flex-wrap:wrap;
  gap:clamp(14px,2vw,24px);margin-top:clamp(20px,3vh,28px)}
/* Шрифт кнопке и ссылке «Скачать прайс» задан явно: они вставлены
   скриптом ниже и своего шрифта не наследовали — браузер брал запасной
   с засечками, «Оставить заявку» и «Скачать прайс» читались Times'ом
   на фоне Montserrat. Замер живой страницы товара 05.10.2026. */
.sa-tp__btn{display:inline-flex;align-items:center;justify-content:center;
  font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;
  height:var(--sa-btn-h);padding:0 var(--sa-btn-px);border-radius:var(--sa-r-ctrl);
  background:#D93800;color:#fff !important;font-size:var(--sa-body);
  font-weight:700;text-decoration:none !important;white-space:nowrap;
  transition:background var(--sa-t) var(--sa-ease)}
.sa-tp__arr{margin-left:8px;transition:transform var(--sa-t) var(--sa-ease)}
.sa-tp__dl{display:inline-flex;align-items:center;gap:9px;
  font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:44px;color:#141210 !important;font-size:var(--sa-body);
  font-weight:600;text-decoration:none !important;
  transition:color var(--sa-t) var(--sa-ease)}
.sa-tp__dl svg{width:18px;height:18px;flex:0 0 auto;fill:none;
  stroke:currentColor;stroke-width:1.8;stroke-linecap:round;
  stroke-linejoin:round}
@media (hover:hover){
  .sa-tp__btn:hover{background:#C23100}
  .sa-tp__btn:hover .sa-tp__arr{transform:translateX(3px)}
  .sa-tp__dl:hover{color:#D93800 !important}
}
@media screen and (max-width:599px){
  .sa-tp__btns{flex-direction:column;align-items:stretch}
  .sa-tp__btn{width:100%}
  .sa-tp__dl{justify-content:center}
}

/* 11. Полоса заявки под карточкой рисуется скриптом шапки и подвала.
       Её внутренняя ширина осталась от прежнего контейнера — ровняем
       по странице, иначе на узком ноутбуке полоса шире карточки. */
#sa-tp-cta .sa-tp-cta__in{
  max-width:min(1240px,90vw) !important;padding-left:0;padding-right:0}
</style>

<script>
/* Страница товара: плашка раздела, условие продажи, таблица
   характеристик и пара кнопок. Всё — поверх разметки Тильды. */
(function(){
  var PRAYS = 'https://raw.githubusercontent.com/fagencymarketing-coder/Saturnphoto/main/files/price-saturn-2026.pdf';

  /* Карточка открывается двумя путями: прямым адресом /tproduct/…
     (разметка .t-catalog__product-snippet) и щелчком по плитке в
     каталоге — тогда Тильда рисует попап с той же начинкой, но
     классом .t-catalog__product-popup. Адрес в обоих случаях
     одинаковый, поэтому ориентируемся на разметку, а не на путь. */
  function naTovare(){
    return !!document.querySelector('.t-catalog__product-snippet, .t-catalog__product-popup');
  }

  /* Раздел («Семена», «Гербициды») в разметку страницы Tilda не кладёт:
     он есть только в скрипте страницы, в product.breadcrumbs. Читаем
     оттуда — это её собственные данные, а не наша догадка по названию.
     Не нашли — плашки просто не будет. */
  function razdel(){
    var sc = document.scripts;
    for(var i=0;i<sc.length;i++){
      var t = sc[i].textContent;
      if(!t || t.indexOf('breadcrumbs') < 0) continue;
      var m = t.match(/breadcrumbs\s*=\s*"(\[[\s\S]*?\])"/);
      if(!m) continue;
      try{
        var a = JSON.parse(m[1].replace(/\\"/g,'"').replace(/\\\//g,'/'));
        for(var j=a.length-1;j>=0;j--){
          if(a[j] && a[j].root === false && a[j].title) return a[j].title;
        }
      }catch(e){}
    }
    return '';
  }

  /* Описание-подпись («Рапс яровой · гибрид F1», «Фертика · удобрения»)
     и цену Tilda в разметку карточки не кладёт — они есть только в
     объекте product в скрипте страницы. Оттуда и берём: это её
     собственные данные, а не разбор названия. */
  /* Возвращаем ноль, пока скрипта товара на странице ещё нет: Tilda
     дописывает его позже, и первый проход (он идёт сразу при разборе
     страницы) данных не застаёт. Запомнить пустой ответ нельзя —
     тогда плашки навсегда останутся не собранными. */
  function tovar(){
    var uid = (location.pathname.match(/\/tproduct\/(\d+)/) || [])[1] || '';
    if(window.__saTpD && window.__saTpD.uid === uid) return window.__saTpD;
    var d = null;

    /* Прямой адрес /tproduct/… — данные товара лежат в объекте product
       в скрипте страницы. «var product» встречается и в библиотеке
       магазина, где полей товара нет, поэтому берём только тот скрипт,
       где есть описание. */
    var sc = document.scripts;
    for(var i=0;i<sc.length;i++){
      var t = sc[i].textContent;
      if(!t || t.indexOf('var product') < 0) continue;
      var a = t.match(/"descr"\s*:\s*"((?:[^"\\]|\\.)*)"/);
      if(!a) continue;
      d = {descr: a[1].replace(/\\"/g,'"').replace(/\\\//g,'/'), price:''};
      var b = t.match(/"price"\s*:\s*(?:"([^"]*)"|null)/);
      if(b) d.price = b[1] || '';
      break;
    }

    /* Щелчок по плитке в каталоге открывает попап. Скрипта товара на
       такой странице нет — Тильда собирает попап на лету. Зато рядом,
       в самой плитке, лежит и подпись, и цена: берём оттуда по номеру
       товара из адреса. */
    if(!d){
      /* Плитку ищем двумя путями: по номеру товара из адреса (так
         бывает на широком экране, где Тильда его подставляет) и по
         той плитке, на которую только что нажали, — её запоминает
         обработчик ниже. На телефоне адрес остаётся /catalog, и
         второй путь единственный. */
      var card = uid ? document.querySelector('.t-catalog__card[data-product-uid="' + uid + '"]') : null;
      if(!card) card = window.__saTpCard || null;
      if(card){
        var ds = card.querySelector('.js-catalog-prod-descr');
        var pr = card.querySelector('.js-catalog-prod-price-val, .js-product-price');
        d = {descr: ds ? ds.textContent.replace(/\s+/g,' ').trim() : '',
             price: pr ? pr.textContent.replace(/[^0-9.,]/g,'') : ''};
      }
    }

    /* Запоминаем вместе с номером товара: в каталоге подряд открывают
       несколько карточек, и данные прошлой подошли бы следующей. */
    if(d){ d.uid = uid; window.__saTpD = d; }

    return d;
  }


  /* Плоский список абзацев → таблица. Делим по первому двоеточию:
     «Урожайность: 12,5–15 ц/га (+11% к стандарту)». Двоеточия внутри
     значения на деление не влияют. Если двоеточия нет вовсе, строка
     целиком уходит в левую колонку и правая остаётся пустой — так
     видно, что у товара заполнено не до конца. */
  var SKRYT = {'Культура':1, 'Тип':1, 'Оригинатор':1};

  function tablica(root){
    var pod = root.querySelector('.t-catalog__prod-popup__brand');
    var POD = pod ? pod.textContent.trim() : '';
    var box = root.querySelector('.js-catalog-prod-all-charcs');
    if(!box || box.getAttribute('data-sa') === 'ok') return;
    var p = box.querySelectorAll('p.js-catalog-prod-charcs');
    if(!p.length) return;
    /* Одно и то же название может повторяться подряд: у «Микромака»
       двенадцать строк «Культура» — пшеница, ячмень, рапс и так далее.
       Двенадцать одинаковых подписей в левой колонке читаются как
       ошибка, поэтому одинаковые названия склеиваем в одну строку
       через «·», как перечисление на холсте. */
    var imena = [], znach = {};
    for(var i=0;i<p.length;i++){
      var s = (p[i].textContent || '').replace(/\s+/g,' ').trim();
      if(!s) continue;
      var k = s, v = '', d = s.indexOf(':');
      if(d > 0){ k = s.slice(0,d).trim(); v = s.slice(d+1).trim(); }
      /* «Культура», «Тип» и «Оригинатор» на холсте в таблице не стоят:
         первые два вынесены плашками над названием, третий — подписью
         под ним. Повторять их строкой ниже незачем. */
      if(SKRYT[k]) continue;
      /* У СЗР действующее вещество стоит подписью под названием —
         строкой ниже оно было бы ровно тем же текстом. */
      if(k === 'Действующее вещество' && ravno(v) === ravno(POD)) continue;
      if(!(k in znach)){ imena.push(k); znach[k] = []; }
      if(v) znach[k].push(v);
    }

    var t = document.createElement('div');
    t.className = 'sa-tp__chars';
    for(var j=0;j<imena.length;j++){
      var r  = document.createElement('div'); r.className  = 'sa-tp__row';
      var kk = document.createElement('div'); kk.className = 'sa-tp__k';
      var vv = document.createElement('div'); vv.className = 'sa-tp__v';
      kk.textContent = imena[j];
      vv.textContent = znach[imena[j]].join(' · ');
      r.appendChild(kk); r.appendChild(vv); t.appendChild(r);
    }
    if(!t.children.length) return;
    box.textContent = '';
    box.appendChild(t);
    box.setAttribute('data-sa','ok');
  }

  /* Цена из описания.

     В описании у позиции с ценой последним предложением стоит
     «Цена: от 585 ₽/л. При 100% предоплате, доставка и хранение
     включены». Единицы измерения больше нигде нет: поле цены в
     магазине хранит только число, и штатная строка Тильды показывает
     «585 р.» — без литра и без «от». Поэтому разбираем предложение,
     строим из него строку цены и условие продажи, а из описания его
     убираем: иначе цена на странице стоит дважды.

     Заполнено так ровно у тех 74 позиций из 112, у которых цена есть
     и в магазине — совпадение полное, проверено по выгрузке.

     Запись не всегда простая. Встречается «от 900 ₽» без единицы,
     «от 700 ₽/л (рассрочка 735 ₽/л)» и «от 48 ₽/кг (МКР) · 54 ₽/кг
     (25 кг)». Поэтому крупно показываем только первое число с
     единицей, а всё, что написано после него, уходит строкой ниже
     вместе с условием продажи. Ничего не выбрасывается и ничего не
     дописывается.

     Разбор строгий. Не совпало — ничего не трогаем: остаётся описание
     как есть и штатная строка Тильды. Лучше скромно, чем неверно. */
  var RE_CENA = /^(от\s+)?([0-9][0-9\s  .,]*?)\s*(₽(?:\s*\/\s*[^\s(.,·]+)?)\s*([\s\S]*)$/;

  function cena(root){
    var el = root.querySelector('.js-catalog-prod-all-text');
    if(!el || el.getAttribute('data-sa-cena')) return;
    var html = el.innerHTML;
    var i = html.indexOf('Цена:');
    if(i < 0) return;

    var hvost = html.slice(i).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()
                    .replace(/^Цена:\s*/, '');

    /* условие продажи отделяем по его началу, а не по первой точке:
       точка может стоять внутри самой цены */
    var j = hvost.search(/При\s+100\s*%/), vyr, uslovie = '';
    if(j > 0){
      vyr = hvost.slice(0, j).replace(/[.\s]+$/, '');
      uslovie = hvost.slice(j).trim();
    } else {
      var k = hvost.indexOf('.');
      vyr = k > 0 ? hvost.slice(0, k) : hvost;
      uslovie = k > 0 ? hvost.slice(k + 1).trim() : '';
    }

    var m = vyr.match(RE_CENA);
    if(!m) return;

    /* описание без последнего предложения, вместе с висящими <br> */
    el.innerHTML = html.slice(0, i).replace(/(?:\s|<br\s*\/?>)+$/i, '');
    el.setAttribute('data-sa-cena', 'ok');

    var box = document.createElement('div');
    box.className = 'sa-tp__price';
    if(m[1]){
      var ot = document.createElement('span');
      ot.className = 'sa-tp__ot'; ot.textContent = 'от';
      box.appendChild(ot);
    }
    var num = document.createElement('span');
    num.className = 'sa-tp__num';
    var raw = m[2].trim();
    /* B2: «1040» → «1 040» (узкий неразрывный пробел) */
    if(/^\d{4,}$/.test(raw)) raw = raw.replace(/\B(?=(\d{3})+$)/g, '\u202F');
    num.textContent = raw;
    var ed = document.createElement('span');
    ed.className = 'sa-tp__unit';
    ed.textContent = m[3].replace(/\s+/g, '');
    box.appendChild(num); box.appendChild(ed);
    el.parentNode.insertBefore(box, el.nextSibling);

    /* Условие продажи («При 100% предоплате…») с карточки убрано по
       решению заказчицы: оно одинаково у всех позиций и под ценой
       только шумит. На холсте 1a оно есть, и 04.10 я вернул его
       оттуда — заказчица попросила убрать второй раз. Холст в этой
       части перебит сознательно.
       Уточнение к самой цене — «(рассрочка 735 ₽/л)», «(МКР) ·
       54 ₽/кг» — остаётся: оно у каждой позиции своё и относится
       к цене, а не к условиям. */
    var nizh = (m[4] || '').trim().replace(/[.\s]+$/, '');
    if(nizh){
      var n = document.createElement('div');
      n.className = 'sa-tp__note';
      n.textContent = nizh;
      box.parentNode.insertBefore(n, box.nextSibling);
    }
    root.classList.add('sa-tp--own-price');
  }

  /* Кириллица → латиница по звучанию, а не по начертанию: «Фертика»
     и «FERTIKA» — одно слово в двух алфавитах, и сравнить их можно
     только так. Первая версия подставляла похожие по виду буквы
     («р» → «p»), и «фертика» превращалась в «feptuka» — не совпало. */
  var TRANSLIT = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e',
    'ж':'zh','з':'z','и':'i','й':'i','к':'k','л':'l','м':'m','н':'n',
    'о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h',
    'ц':'c','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'y','ь':'','э':'e',
    'ю':'yu','я':'ya'};
  function ravno(t){
    return (t || '').toLowerCase().replace(/[^a-zа-яё0-9]+/g, '')
      .replace(/[а-яё]/g, function(c){ return TRANSLIT[c] !== undefined ? TRANSLIT[c] : c; });
  }

  function dorisovat(){
    if(!naTovare() || !document.body) return;
    var root = document.querySelector('.t-catalog__product-snippet, .t-catalog__product-popup');
    if(!root) return;

    var brend = root.querySelector('.t-catalog__prod-popup__brand');

    /* Семена отличаются от препаратов не оформлением, а содержанием:
       цены у них нет (её запрашивают), снимок — поле, а не упаковка,
       и цифры по сорту взяты из чужих реестров. Поэтому у карточки
       свой признак, от которого работают три правила ниже. */
    if(razdel() === 'Семена') root.classList.add('sa-tp--semena');

    /* B1 05.10: снимок поля (jpg) заполняет кадр, упаковка (png) вписана
       целиком. Признак — расширение файла: фото без упаковки у нас всегда
       jpg, упаковки на прозрачном фоне — png. */
    var im0 = root.querySelector('.t-catalog__prod-popup__col-left [data-original],.t-catalog__prod-popup__col-left img');
    var u0 = im0 && (im0.getAttribute('data-original') || im0.getAttribute('src') || im0.getAttribute('data-lazy-rule') || '');
    if(/\.jpe?g(\?|$)/i.test(u0)) root.classList.add('sa-tp--photo');
    /* A5: числа вида 18-18-18 в названии не рвутся по дефису */
    var h1 = root.querySelector('h1.t-catalog__prod-popup__name');
    if(h1 && !h1.getAttribute('data-sa-nb') && !h1.children.length){
      h1.innerHTML = h1.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/\d+(?:-\d+)+/g, function(t){ return '<span style="white-space:nowrap">' + t + '</span>'; });
      h1.setAttribute('data-sa-nb','1');
    }

    /* Плашки над названием. На холсте у семян их две — «РАПС ЯРОВОЙ»
       и «ГИБРИД F1», у препарата одна — «УДОБРЕНИЯ». И то и другое
       лежит в описании-подписи товара: «Рапс яровой · гибрид F1»,
       «Фертика · удобрения». Берём её части; ту, что повторяет
       производителя, пропускаем — он и так стоит строкой ниже.

       Часть, которая на плашку не годится (у СЗР это «фомесафен
       250 г/л» — формула, а не раздел), уходит подписью под название,
       а плашкой встаёт раздел из крошек: «Гербициды». */
    var MERA = /\d\s*(?:г|мг|кг|мл)\s*\/\s*(?:л|кг|т|га)/i;
    var dan = tovar();
    var tw = root.querySelector('.t-catalog__prod-popup__title-wrapper');
    if(dan && tw && !tw.querySelector('.sa-tp__cats')){
      var bt = brend ? ravno(brend.textContent) : '';
      var chasti = (dan.descr || '').split('·'), plashki = [], podpis = [];
      for(var ci=0;ci<chasti.length;ci++){
        var ch = chasti[ci].trim();
        if(!ch || (bt && ravno(ch) === bt)) continue;
        if(ch.length <= 26 && !MERA.test(ch)) plashki.push(ch); else podpis.push(ch);
      }
      if(!plashki.length){ var rz = razdel(); if(rz) plashki.push(rz); }
      if(plashki.length){
        var box = document.createElement('div');
        box.className = 'sa-tp__cats';
        for(var pi=0;pi<plashki.length;pi++){
          var c = document.createElement('div');
          c.className = 'sa-tp__cat' + (pi ? ' sa-tp__cat--out' : '');
          c.textContent = plashki[pi];
          box.appendChild(c);
        }
        tw.insertBefore(box, tw.firstChild);
      }
      /* у СЗР производителя в магазине нет — ставим туда то, что не
         поместилось в плашку, чтобы строка под названием не пустовала */
      if(brend && !brend.textContent.trim() && podpis.length){
        brend.textContent = podpis.join(' · ');
      }
    }

    /* Таблицу собираем после плашек и подписи: из неё убираются те
       строки, которые уже встали выше, и для этого надо знать, что
       именно там оказалось. */
    tablica(root);
    cena(root);

    var info = root.querySelector('.t-catalog__prod-popup__info');

    /* 06.10 (заказчица): строку-источник «Данные оригинатора и
       Госсорткомиссии» на эталоне перечеркнули — убрали. Больше не
       рисуем её под таблицей. */

    if(dan && info && !info.querySelector('.sa-tp__btns')){
      /* У позиции с ценой зовём оставить заявку, у позиции без цены —
         запросить цену: на холсте у семян кнопка подписана именно так,
         и это честнее, чем общее «оставить заявку» там, где цены нет. */
      var zovut = (dan && dan.price) ? 'Оставить заявку' : 'Запросить цену';
      /* 06.10 (заказчица): кнопка уводила на /home#contacts — «перекидывает
         на контакты». Если на странице есть попап заявки (его надо сделать
         глобальным в Tilda, чтобы он доезжал и до страниц товара) — открываем
         его, не уходя со страницы. Пока попапа на странице товара нет —
         остаётся переход на форму в контактах, чтобы кнопка не была мёртвой. */
      var zayHref = document.querySelector('.t-popup') ? '#popup:zayavka' : '/home#contacts';
      var b = document.createElement('div');
      b.className = 'sa-tp__btns';
      b.innerHTML =
        '<a class="sa-tp__btn" href="' + zayHref + '">' + zovut +
        '<span class="sa-tp__arr" aria-hidden="true">→</span></a>' +
        '<a class="sa-tp__dl" href="' + PRAYS + '" target="_blank" rel="noopener">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>' +
        'Скачать прайс</a>';
      info.appendChild(b);
    }
  }

  /* Клик по плитке в каталоге всегда ведёт на полную страницу
     товара /tproduct/, а не в попап. Попап Тильды — это слайдер
     галереи со своей разметкой: колонки в нём схлопываются, фото
     уходит под текст, а на телефоне характеристик в нём нет вовсе.
     Полная страница работает одинаково и красиво на всех ширинах,
     все карточки единообразны. Адрес страницы лежит в самой плитке. */
  document.addEventListener('click', function(e){
    var c = e.target && e.target.closest && e.target.closest('.t-catalog__card');
    if(!c) return;
    var u = c.getAttribute('data-product-url');
    if(!u) return;
    e.preventDefault(); e.stopPropagation();
    location.href = u;
  }, true);

  /* Запоминаем плитку, по которой нажали: попап Тильда собирает на
     лету, номера товара в нём нет, а в плитке есть и подпись, и цена.
     Слушаем на стадии перехвата, чтобы успеть раньше самой Тильды. */
  document.addEventListener('click', function(e){
    var c = e.target && e.target.closest && e.target.closest('.t-catalog__card');
    if(c){ window.__saTpCard = c; window.__saTpD = null; }
  }, true);

  function vse(){ try{ dorisovat(); }catch(e){} }
  vse();
  document.addEventListener('DOMContentLoaded', vse);
  window.addEventListener('load', vse);
  /* Карточку Tilda дособирает скриптом уже после загрузки, поэтому
     ждём изменений. Все вставки защищены проверками, так что
     наблюдатель не гоняет работу по кругу. */
  if(window.MutationObserver){
    new MutationObserver(function(){
      clearTimeout(window.__saTpT);
      window.__saTpT = setTimeout(vse, 120);
    }).observe(document.documentElement, {childList:true, subtree:true});
  }
})();
</script>
