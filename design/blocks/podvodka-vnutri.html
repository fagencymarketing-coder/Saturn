<!-- Третий вариант: текст встроен в шапку блока продукции, отдельной секции нет. -->
<style>
.sa-pvi{--ink:#141210;--acc:#FF4200;--mut:#6B6560;--line:#E6E2DC;
  font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:#fff;padding:72px 0 0}
.sa-pvi *{box-sizing:border-box;margin:0;padding:0}
.sa-pvi__in{max-width:min(1240px,90vw);margin:0 auto;padding:0 20px}
.sa-pvi__kicker{display:inline-flex;align-items:center;gap:12px;font-size:var(--sa-kick,12px);
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);line-height:1}
.sa-pvi__kicker::before{content:"";width:24px;height:2px;background:var(--acc)}
.sa-pvi__h{font-size:var(--sa-h2,30px);font-weight:800;line-height:var(--sa-h2-lh,1.15);
  margin-top:16px;letter-spacing:-.01em;text-wrap:balance;max-width:900px}
.sa-pvi__p{font-size:var(--sa-lead,16px);line-height:1.55;color:var(--mut);margin-top:12px;max-width:680px}
.sa-pvi__btn{display:inline-flex;align-items:center;gap:10px;margin-top:20px;
  font-size:var(--sa-body,15px);font-weight:700;color:var(--acc);text-decoration:none;
  transition:gap var(--sa-t,.18s) var(--sa-ease,ease)}
.sa-pvi__btn i{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:999px;border:1px solid rgba(255,66,0,.5);font-style:normal}
@media (hover:hover){.sa-pvi__btn:hover{gap:14px}}
@media (max-width:767px){.sa-pvi{padding:48px 0 0}}
</style>

<div class="sa-pvi">
  <div class="sa-pvi__in">
    <p class="sa-pvi__kicker">Продукция</p>
    <h2 class="sa-pvi__h">Все препараты, которые попали в наш каталог, прошли многократные полевые испытания и доказали свою пользу</h2>
    <p class="sa-pvi__p">Мы никогда не предлагаем продукцию, в которой не уверены на 100%.</p>
    <a class="sa-pvi__btn" href="#protokoly">Смотреть протоколы испытаний <i aria-hidden="true">→</i></a>
  </div>
</div>
