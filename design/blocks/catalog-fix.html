<!-- Правки оформления каталога ST340F. Версия 3.
     Ставить ОДИН раз в Настройки сайта → Вставка кода (внутрь <body>),
     тогда код работает и на прямых адресах товаров /tproduct/...,
     куда блоки страницы не подставляются. -->
<style>
/* 1. Убрать оранжевые линии под разделами и фильтрами.
      Это не text-decoration и не border, а внутренняя тень. */
.js-catalog-parts-switcher,
.t-catalog__parts-switch-btn,
.t-catalog__parts-button-base,
.t-catalog__filter__title,
.t-catalog__filter__custom-sel,
.js-catalog-filter-custom-select{
  box-shadow:none !important;
  text-decoration:none !important;
  border-bottom:0 !important;
}

/* 2. Фото товара вписывается целиком на светлую подложку */
.t-catalog__card__imgwrapper{background:#F0EDE9 !important;border-radius:12px;overflow:hidden}
.t-catalog__card__bgimg,
.js-product-img.t-bgimg{background-size:contain !important;background-position:center !important;
  background-repeat:no-repeat !important}
/* на странице товара фото — это <img>, а не фон */
img.js-product-img,
.t-catalog__prod-popup__columns img.js-product-img{object-fit:contain !important;background:#F0EDE9}

/* 3. Кнопка «Оставить заявку»: текст целиком, в две строки если надо */
.js-catalog-prod-btn,
.t-catalog__card__btns-wrapper .t-btn{
  padding:12px 16px !important;height:auto !important;min-height:52px !important;
  white-space:normal !important;line-height:1.25 !important;
  display:flex !important;align-items:center;justify-content:center;text-align:center}
.t-catalog__card__btn-text,
.js-catalog-prod-btn .t-btnflex__text{
  white-space:normal !important;overflow:visible !important;text-overflow:clip !important;
  line-height:1.25 !important}

/* 4. Название товара — не длиннее двух строк, чтобы карточки не прыгали */
.t-catalog__card__title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}

/* 5. Три карточки в ряд на планшете.
      Ширину задаёт .t-catalog__stretch-col, медиазапрос Тильды перебивает _25,
      поэтому нужен !important. column-gap на этих ширинах — 10px. */
@media screen and (min-width:768px) and (max-width:960px){
  .t-catalog__card-list > .js-product,
  .t-catalog__card-list .t-catalog__stretch-col{
    width:calc((100% - 20px) / 3) !important;
  }
}

/* 6. Карточка товара не должна уезжать вбок на планшетной ширине:
      слайдер Tilda шире вьюпорта, а блок с описанием — на 10px шире экрана */
.t-catalog__prod-popup__info{max-width:100% !important;box-sizing:border-box}
.t-slds__items-wrapper{overflow:hidden}

/* 7. Подстановка «Цена по запросу» (сам текст ставит скрипт) */
.t-catalog__card__price-wrapper[data-sa-ask],
.js-catalog-price-wrapper[data-sa-ask]{
  display:block !important;font-size:14px;font-weight:400;color:#8A837C}
</style>

<script>
(function(){
  function fix(){
    /* A. «Цена по запросу» там, где цены нет.
          Обёртка НЕ пустая: Тильда всегда рисует два значка валюты «р.»,
          поэтому проверяем наличие цифр внутри блока самой цены. */
    document.querySelectorAll('.t-catalog__card__price-wrapper,.js-catalog-price-wrapper')
      .forEach(function(el){
        if(el.dataset.saFixed) return;
        var val = el.querySelector('.js-product-price,.js-catalog-prod-price-val');
        var hasPrice = val && /\d/.test(val.textContent);
        if(!hasPrice){
          el.textContent = 'Цена по запросу';
          el.setAttribute('data-sa-ask','1');
          /* Tilda вешает инлайновый visibility:hidden, когда цены нет.
             Инлайновый стиль перебивается только через setProperty + important. */
          el.style.setProperty('visibility','visible','important');
          el.style.setProperty('display','block','important');
          el.style.fontFamily = 'Montserrat,-apple-system,Segoe UI,Roboto,sans-serif';
        }
        el.dataset.saFixed = '1';
      });

    /* B. Двенадцать строк «Культура» → одна строка через запятую.
          Фильтр это не ломает: он читает данные товара, а не видимый текст. */
    document.querySelectorAll('.js-catalog-prod-all-charcs').forEach(function(box){
      if(box.dataset.saCrops) return;
      var rows = [].slice.call(box.querySelectorAll('p.t-typography__characteristics'))
        .filter(function(p){ return /^\s*Культура\s*:/.test(p.textContent); });
      if(rows.length > 1){
        var vals = rows.map(function(p){
          return p.textContent.replace(/^\s*Культура\s*:\s*/,'').trim();
        }).filter(Boolean);
        rows[0].textContent = 'Культура: ' + vals.join(', ');
        rows.slice(1).forEach(function(p){ p.remove(); });
      }
      box.dataset.saCrops = '1';
    });
  }
  fix();
  document.addEventListener('DOMContentLoaded', fix);
  window.addEventListener('load', fix);
  /* каталог дорисовывает карточки и открывает товар без перезагрузки */
  new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
