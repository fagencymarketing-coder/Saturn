<!-- Правки оформления каталога ST340F. Версия 3.
     Ставить ОДИН раз в Настройки сайта → Вставка кода (внутрь <body>),
     тогда код работает и на прямых адресах товаров /tproduct/...,
     куда блоки страницы не подставляются. -->
<style>
/* 1. Убрать оранжевые линии под разделами и фильтрами.
      Это не text-decoration и не border, а внутренняя тень. */
.js-catalog-parts-switcher,
.t-catalog__parts-switch-btn,
.t-catalog__parts-button-base,
.t-catalog__filter__title,
.t-catalog__filter__custom-sel,
.js-catalog-filter-custom-select{
  box-shadow:none !important;
  text-decoration:none !important;
  border-bottom:0 !important;
}

/* 2. Фото товара вписывается целиком на светлую подложку */
.t-catalog__card__imgwrapper{background:#F0EDE9 !important;border-radius:12px;overflow:hidden}
.t-catalog__card__bgimg,
.js-product-img.t-bgimg{background-size:contain !important;background-position:center !important;
  background-repeat:no-repeat !important}
/* на странице товара фото — это <img>, а не фон */
img.js-product-img,
.t-catalog__prod-popup__columns img.js-product-img{object-fit:contain !important;background:#F0EDE9}

/* 3. Кнопка «Оставить заявку» убрана из плитки каталога.
      На утверждённом холсте в карточке только название, описание и
      цифра — красной кнопки под каждым товаром нет. Она остаётся там,
      где нужна: на странице товара. Решение заказчика 03.10.2026.

      Классы различаются, и это важно:
        t-catalog__card__btn      — кнопка в плитке, её прячем;
        t-catalog__prod-popup__btn — кнопка на странице товара, не трогаем.
      Прячем вместе с обёрткой, иначе от неё останется пустая полоса. */
.t-catalog__card__btn,
.t-catalog__card__btns-wrapper,
.js-catalog-prod-btn{display:none !important}

/* 4. Название товара — не длиннее двух строк, чтобы карточки не прыгали */
.t-catalog__card__title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}

/* 5. Три карточки в ряд на планшете.
      Ширину задаёт .t-catalog__stretch-col, медиазапрос Тильды перебивает _25,
      поэтому нужен !important. column-gap на этих ширинах — 10px. */
@media screen and (min-width:768px) and (max-width:960px){
  .t-catalog__card-list > .js-product,
  .t-catalog__card-list .t-catalog__stretch-col{
    width:calc((100% - 20px) / 3) !important;
  }
}

/* 6. Карточка товара не должна уезжать вбок на планшетной ширине:
      слайдер Tilda шире вьюпорта, а блок с описанием — на 10px шире экрана */
.t-catalog__prod-popup__info{max-width:100% !important;box-sizing:border-box}
.t-slds__items-wrapper{overflow:hidden}
/* ширина колонки уже равна 100% контейнера, но у .t-col остаётся
   штатный боковой отступ Tilda 10px — он и даёт переполнение */
.t-catalog__prod-popup__col-right{margin-left:0 !important;margin-right:0 !important}

/* 7. Строка цены там, где цены нет, убирается совсем. Раньше мы
      подставляли «Цена по запросу» — заказчик 04.10.2026 попросил убрать:
      у 112 товаров из 112 цены в магазине нет, и одинаковая серая строка
      под каждой карточкой читалась как брак, а не как условие продажи.
      Пустая обёртка схлопывается, карточка становится короче. */
.t-catalog__card__price-wrapper[data-sa-ask],
.js-catalog-price-wrapper[data-sa-ask]{display:none !important}

/* 8. Вертикальный ритм страницы каталога.
      У блока ST340F собственные 135px сверху и снизу плюс 90px под
      подзаголовком — из-за этого страница распадается на пустые экраны. */
.t-rec[data-record-type="2861"]{padding-top:40px !important;padding-bottom:72px !important}
.t-catalog__grid-cont .t-section__title{margin-bottom:20px !important}
.t-catalog__grid-cont .t-section__descr{margin-bottom:36px !important}
.t-catalog__grid-cont .t-section__container:not(:has(.t-section__descr)) .t-section__title{
  margin-bottom:32px !important}
@media screen and (max-width:960px){
  .t-rec[data-record-type="2861"]{padding-top:28px !important;padding-bottom:52px !important}
  .t-catalog__grid-cont .t-section__title{margin-bottom:16px !important}
  .t-catalog__grid-cont .t-section__descr{margin-bottom:28px !important}
}

/* 9. Хлебные крошки убраны совсем.
      На утверждённом холсте каталога их нет: страница начинается прямо
      с заголовка «Каталог». Сайт одноуровневый, каталог — второй и
      последний уровень, так что крошки «Главная / Каталог» ничего не
      сообщают, а экран занимают. Решение заказчика 03.10.2026.
      Раньше здесь мы их только ужимали: домик у Тильды 14px при
      заголовке 44px смотрелся мусором. Теперь вопрос снят целиком. */
[class*="t-catalog__breadcrumb"],[class*="t-breadcrumb"]{display:none !important}

/* 10. Разделы над товарами — пустые плитки без картинок, занимают полтора
       экрана. На ПК они дублируют боковую панель, поэтому скрыты;
       на телефоне панель прячется в «Фильтры», поэтому разделы остаются,
       но без пустых кружков-заглушек. */
@media screen and (min-width:961px){
  [id^="parts-above-id-"]{display:none !important}
}
@media screen and (max-width:960px){
  [id^="parts-above-id-"] [class*="img"]{display:none !important}
  [id^="parts-above-id-"] [class*="card"]{min-height:0 !important}
}

/* 11. Страница товара по прямому адресу /tproduct/: у Тильды описание
       уходит под фотографию, и правая половина экрана остаётся пустой. */
@media screen and (min-width:960px){
  .t-catalog__product-snippet .t-container > div{
    display:flex;align-items:flex-start;gap:40px}
  .t-catalog__product-snippet .t-catalog__prod-popup__col-left{
    flex:0 0 auto;width:46%;max-width:520px;margin:0}
  .t-catalog__product-snippet .t-catalog__prod-popup__col-right{
    flex:1 1 auto;max-width:none;width:auto;margin:0;padding-top:0}
}

/* 12. Разделы в боковой панели краснели при наведении. Глобальное
       правило Тильды оказалось не просто a:hover, а списком селекторов
       её типографики — .t-text a:hover, .t-descr a:hover, .t-title a:hover
       и так далее, цвет #d93800. Самодельные блоки sa-* под него не
       попадают, а вот девять ссылок боковой панели попали: «Все»,
       «Семена», «Гербициды», «Удобрения и листовые подкормки»,
       «Адъюванты», «Обработка семян и протравители», «Фунгициды»,
       «Инсектициды», «Десиканты». Нашёл агент при прогоне 03.10.2026,
       замерено наведением: #333333 → #d93800.

       Задаём наведение явно, как требует правило проекта. Цвет при
       наведении не меняем — отклик даёт подчёркивание, как у разделов
       и фильтров в остальном каталоге: box-shadow inset, а не
       text-decoration и не border. Так раздел не выглядит выбранным,
       пока по нему не щёлкнули. */
.t-catalog__parts-sidebar-item,
.t-catalog__parts-sidebar-item a,
.t-catalog__parts-sidebar__list a{
  color:#141210;
  transition:box-shadow .15s ease}
.t-catalog__parts-sidebar-item:hover,
.t-catalog__parts-sidebar-item a:hover,
.t-catalog__parts-sidebar__list a:hover,
#allrecords .t-catalog__parts-sidebar-item a:hover,
#allrecords .t-catalog__parts-sidebar__list a:hover{
  color:#141210;
  box-shadow:inset 0 -1px 0 0 #141210}

/* 13. Штатные поиск и сортировка Тильды спрятаны: сверху каталога стоит
       наш блок с полем и чипами культур по холсту, два поиска подряд
       не нужны. Прячем стилем, а не галкой «Спрятать поиск и
       сортировку» в настройках блока: наше поле не ищет само, оно
       пишет в штатный input и щёлкает его лупу. Скрытое стилями поле
       остаётся в разметке и работает — проверено на живой странице
       04.10.2026. Что делает галка, вырезает она разметку или прячет,
       неизвестно, и выяснять это ценой сломанного поиска незачем.
       Сама Тильда ниже 961 px прячет этот блок тем же способом. */
.t-catalog__filter__search-and-sort,
.t-catalog__filter__sort{display:none !important}


/* 14. Боковая панель не уезжает вверх при прокрутке. Заказчик 04.10.2026:
       «при скроллинге каталога вниз меню слева не должно исчезать»,
       и на холсте Клод Дизайна оно действительно стоит на месте.
       Липкость даём своим стилем, а не галкой «закрепить» в Тильде:
       её закрепление заводит панели собственную полосу прокрутки на всю
       высоту. Здесь панель прокручивается только если сама не влезает,
       а отступ сверху 88 = высота шапки 72 плюс 16 воздуха.
       Селектор снят с живой страницы: колонка фильтра — это
       .t-catalog__filter-wrapper, внутри .js-sidebar-filters. */
@media screen and (min-width:961px){
  .t-catalog__filter-wrapper{
    position:sticky !important;top:88px;align-self:flex-start;
    max-height:calc(100vh - 104px);overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:#D8D3CE transparent}
  .t-catalog__filter-wrapper::-webkit-scrollbar{width:6px}
  .t-catalog__filter-wrapper::-webkit-scrollbar-thumb{
    background:#D8D3CE;border-radius:999px}
}

</style>

<script>
(function(){
  function fix(){
    /* 0. «Load more» → «Загрузить ещё».
          Поля для этой надписи в настройках блока нет — агент искал его
          в трёх разделах и не нашёл. Тильда рисует её из шаблона
          button_loadmore_<recid>, латиницей, и меняется она только так. */
    document.querySelectorAll('.js-catalog-load-more-btn-text')
      .forEach(function(el){
        if (/^\s*Load more\s*$/.test(el.textContent)) el.textContent = 'Загрузить ещё';
      });

    /* A. Карточка без цены не показывает строку цены вовсе.
          Обёртка НЕ пустая: Тильда всегда рисует два значка валюты «р.»,
          поэтому проверяем наличие цифр внутри блока самой цены. */
    document.querySelectorAll('.t-catalog__card__price-wrapper,.js-catalog-price-wrapper')
      .forEach(function(el){
        if(el.dataset.saFixed) return;
        var val = el.querySelector('.js-product-price,.js-catalog-prod-price-val');
        var hasPrice = val && /\d/.test(val.textContent);
        if(!hasPrice){
          el.setAttribute('data-sa-ask','1');
          el.style.setProperty('display','none','important');
        }
        el.dataset.saFixed = '1';
      });

    /* B. Двенадцать строк «Культура» → одна строка через запятую.
          Фильтр это не ломает: он читает данные товара, а не видимый текст. */
    document.querySelectorAll('.js-catalog-prod-all-charcs').forEach(function(box){
      if(box.dataset.saCrops) return;
      var rows = [].slice.call(box.querySelectorAll('p.t-typography__characteristics'))
        .filter(function(p){ return /^\s*Культура\s*:/.test(p.textContent); });
      if(rows.length > 1){
        var vals = rows.map(function(p){
          return p.textContent.replace(/^\s*Культура\s*:\s*/,'').trim();
        }).filter(Boolean);
        rows[0].textContent = 'Культура: ' + vals.join(', ');
        rows.slice(1).forEach(function(p){ p.remove(); });
      }
      box.dataset.saCrops = '1';
    });
  }
  fix();
  document.addEventListener('DOMContentLoaded', fix);
  window.addEventListener('load', fix);
  /* каталог дорисовывает карточки и открывает товар без перезагрузки */
  new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
