     ВЫШЕ блока ST340F.
     Заголовок + «Скачать прайс», поле поиска, чипы культур.
     Все размеры сняты с утверждённого холста каталога
     (артефакт KsY2QrkP2cb6zXnkCV7N5V, версия 1791033969-2f19):
     поиск 52px r12 #fff рамка #E7E3DE, чип h40 14/600 r999 рамка

     На телефоне (холст XLBmbZPG88N19nNW4gPbPW) поиск подписан

<style>
.sa-kv{--ink:#141210;--acc:#FF4200;--mut:#6B6560;--line:#E7E3DE;
  font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:#fff;padding:40px 0 24px}
.sa-kv *{box-sizing:border-box;margin:0;padding:0}
/* Ширина контента — не жёсткие 1240, а доля окна с потолком. На 1440
   и шире ничего не меняется: 90vw там больше 1240, работает потолок.
   А на узком десктопе (ноутбук, масштаб Windows 150%) контент
   переставал быть «колонкой на странице» и занимал почти весь экран —
   отсюда и ощущение «всё крупное». Теперь поля растут вместе с окном.
   Заказчик 04.10.2026. */
.sa-kv__in{max-width:min(1240px,90vw);margin:0 auto;padding:0 20px}
/* Свои хлебные крошки: штатные у Тильды лежат внутри блока каталога,
   то есть ниже этого блока, и там им не место. Кегль 13 против 40 у
   заголовка — крошки служебные и спорить с ним не должны. */
.sa-kv__crumbs{display:flex;align-items:center;gap:8px;font-size:var(--sa-small);
  line-height:18px;color:#6B6560;margin-bottom:12px}
/* Цвета подняты до нормы контраста 4,5:1 — на светлом фоне #8A837C
   давал 3,74, а серо-серый «Каталог» вовсе 2,15. Текущий раздел
   отличается от ссылки не бледностью, а тем, что он не ссылка. */
.sa-kv__crumbs a{color:#6B6560;text-decoration:none;
  display:inline-flex;align-items:center;min-height:44px}
.sa-kv__crumbs b{font-weight:400;color:#141210}
.sa-kv__crumbs span{color:#6B6560}
@media (hover:hover){.sa-kv__crumbs a:hover{color:#141210}}
@media (max-width:767px){.sa-kv__crumbs{font-size:12px;margin-bottom:10px}}
/* Счётчик позиций: человек сразу понимает масштаб каталога, а после
   фильтра видит, сколько осталось. Число не вписано руками — его
   ставит скрипт по тому, что показывает сам магазин, иначе оно
   разойдётся с правдой в первый же день. */
.sa-kv__count{font-size:var(--sa-body);font-weight:400;color:#6B6560;margin-top:6px}
.sa-kv__top{display:flex;align-items:center;justify-content:space-between;gap:24px}
/* Кегль — из общей шкалы сайта, см. :root в коде HEAD. */
.sa-kv__h{font-size:var(--sa-h2);font-weight:800;line-height:var(--sa-h2-lh);letter-spacing:-.01em}
.sa-kv__price{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;
  color:var(--ink);text-decoration:none;position:relative}
.sa-kv__price svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
/* зона нажатия 44px при высоте строки 18 */
.sa-kv__price::after{content:"";position:absolute;left:-10px;right:-10px;top:-13px;bottom:-13px}
@media (hover:hover){.sa-kv__price:hover{color:var(--ink);box-shadow:inset 0 -1px 0 0 var(--ink)}}

.sa-kv__search{position:relative;margin-top:24px}
.sa-kv__search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;fill:none;stroke:#8A837C;stroke-width:1.8;pointer-events:none}
.sa-kv__input{width:100%;height:var(--sa-fld-h);border-radius:var(--sa-r-ctrl);background:#fff;
  border:1px solid var(--line);padding:0 18px 0 50px;font-size:16px;font-weight:400;
  font-family:inherit;color:var(--ink);outline:none}
.sa-kv__input::placeholder{color:#8A837C}
.sa-kv__input:focus{border-color:var(--acc)}

.sa-kv__chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
/* 44 — цель нажатия на планшете и телефоне; на ПК столько же,

.sa-kv__chip{display:inline-flex;align-items:center;height:44px;padding:0 16px;

@media (hover:hover){.sa-kv__chip:hover{border-color:var(--ink);color:var(--ink)}}

.sa-kv__parts{display:none}

@media (max-width:1023px){

@media (max-width:767px){

  .sa-kv__parts{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;

}

/* ===== Шторка фильтров (телефон и планшет) ============================== */
.sa-kv__dr,.sa-kv__ov{--ink:#141210;--acc:#FF4200;--mut:#6B6560;

.sa-kv__dr *{box-sizing:border-box;margin:0;padding:0}

.sa-kv__dr{position:fixed;z-index:9001;left:0;right:0;bottom:0;max-height:86dvh;

.sa-kv__drtop{display:flex;align-items:center;justify-content:space-between;

.sa-kv__drx{width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;

.sa-kv__drx svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round}
.sa-kv__drbody{overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 20px}
.sa-kv__drh{font-size:var(--sa-kick);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:#6B6560;margin:20px 0 10px}
.sa-kv__drlist{display:flex;flex-direction:column}
.sa-kv__drlist a{display:flex;align-items:center;min-height:48px;
  font-size:var(--sa-body);font-weight:600;color:var(--ink);text-decoration:none;

.sa-kv__drchips{display:flex;flex-wrap:wrap;gap:8px}
/* Культура на мобиле — чипами на странице (как на десктопе), поэтому
   из ящика «Фильтры» её убираем: иначе фильтр по культуре стоит дважды
   (замечание заказчицы 05.10). В ящике остаются только разделы. */
.sa-kv__drh--cult,.sa-kv__drh--cult + .sa-kv__drchips{display:none !important}
/* 09.10 (заказчица): фильтр по культуре — только в разделе «Семена».
   В разделах с препаратами и в общем списке «Все» культурные чипы
   скрываем (класс sa-kv--nocrops ставит скрипт по разделу из адреса).
   На ПК прячем всю полосу чипов (кнопки «Фильтры» там нет — пустого
   места не остаётся); на телефоне полосу оставляем ради кнопки
   «Фильтры», прячем только сами чипы культур. */
.sa-kv--nocrops .sa-kv__chip{display:none !important}
@media (min-width:1024px){.sa-kv--nocrops .sa-kv__chips{display:none !important}}
.sa-kv__drbot{padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)}
.sa-kv__drok{width:100%;height:var(--sa-btn-h);border:0;border-radius:var(--sa-r-ctrl);
  background:#D93800;color:#fff;font-family:inherit;font-size:var(--sa-lead);
  font-weight:700;cursor:pointer}
/* На ПК шторки нет: там боковая панель каталога. */
@media (min-width:1024px){
  .sa-kv__ov,.sa-kv__dr{display:none !important}
}
@media (prefers-reduced-motion:reduce){
  .sa-kv__ov,.sa-kv__dr{transition:none}
}
</style>

<script>
/* Поиск и чипы не изобретают свой фильтр, а управляют штатным каталогом
   Tilda: пишут в его поле поиска и щёлкают его чекбоксы культуры. Так
   результат всегда совпадает с тем, что показывает сам магазин.

   Селекторы и поведение сняты с живой страницы 04.10.2026, а не угаданы:

   - поле поиска  input.js-catalog-filter-search, name="query";
   - на input, change, keyup и keydown Тильда не реагирует вовсе.
     Поиск запускает только keypress с keyCode 13 либо клик по лупе
     .js-catalog-filter-search-btn. Берём клик по лупе — он надёжнее
     и не зависит от того, как собрано событие;
   - поиск серверный, ответ приходит примерно через 600 мс;
   - чекбокс культуры  input.js-catalog-filter-opt-chb, атрибут name
     равен названию культуры — искать по подписи не нужно;
   - скрытое стилями поле остаётся в разметке и продолжает работать:
     проверено на живой странице с display:none. Поэтому штатный блок
     поиска прячет наш CSS (catalog-fix), а не галка Тильды —
     про галку неизвестно, прячет она или вырезает. */
(function(){
  var POLE  = 'input.js-catalog-filter-search';
  var LUPA  = '.js-catalog-filter-search-btn';
  var KROPK = 'input.js-catalog-filter-opt-chb';

  /* Пустой запрос штатный поиск не принимает: после «Ничего не найдено»
     очистка поля оставляла каталог пустым навсегда — адрес чистый, карточек
     ноль, сообщения нет, Enter не помогает. Замер живой страницы 05.10.2026,
     повторён с паузой 12 секунд. Поэтому при пустом поле убираем параметр
     поиска из адреса сами и перезагружаем: фильтр по культуре в адресе
     остаётся и применяется заново. */
  function sbrosPoiska(){
    var u = new URL(location.href), byl = false;
    Array.from(u.searchParams.keys()).forEach(function(k){
      if (k.indexOf('tfc_query[') === 0){ u.searchParams.delete(k); byl = true; }
    });
    if (byl) location.replace(u.toString());
  }

  function iskat(znach){
    if (znach === ''){ sbrosPoiska(); return; }
    var pole = document.querySelector(POLE);
    var lupa = document.querySelector(LUPA);
    if (!pole || !lupa) return;
    var proto = Object.getPrototypeOf(pole);
    var d = Object.getOwnPropertyDescriptor(proto, 'value');
    if (d && d.set) d.set.call(pole, znach); else pole.value = znach;
    lupa.dispatchEvent(new MouseEvent('click', {bubbles:true}));
  }

  var nashe = document.querySelector('.sa-kv__input');
  /* A6 05.10: на телефоне плейсхолдер короткий — длинный обрезался
     («…действующее веще»). Как на холсте. */
  (function(){
    if(!nashe || !window.matchMedia) return;
    var mq = window.matchMedia('(max-width:767px)');
    function ph(){ nashe.placeholder = nashe.getAttribute(mq.matches ? 'data-ph-short' : 'data-ph-long'); }
    ph();
    if(mq.addEventListener) mq.addEventListener('change', ph); else if(mq.addListener) mq.addListener(ph);
  })();
  if (nashe){
    var t;
    /* Запрос уходит на сервер, поэтому ждём паузы в наборе, а не шлём
       на каждую букву. 450 мс — чуть больше, чем ответ каталога. */
    nashe.addEventListener('input', function(){
      clearTimeout(t);
      var v = nashe.value;
      t = setTimeout(function(){ iskat(v); }, 450);
    });
    nashe.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); clearTimeout(t); iskat(nashe.value); }
    });
  }

  function snyat(){
    var all = document.querySelectorAll(KROPK);
    for (var i = 0; i < all.length; i++) if (all[i].checked) all[i].click();
  }

  var chips = document.querySelectorAll('.sa-kv__chip');
  for (var i = 0; i < chips.length; i++){
    chips[i].addEventListener('click', function(){
      for (var j = 0; j < chips.length; j++) chips[j].setAttribute('aria-pressed','false');
      this.setAttribute('aria-pressed','true');
      var crop = this.getAttribute('data-crop');
      snyat();
      if (!crop) return;
      var b = document.querySelector(KROPK + '[name="' + crop + '"]');
      if (b && !b.checked) b.click();
    });
  }

  /* Состояние берём из адреса. Раньше после возврата со страницы товара
     кнопкой «назад», после обновления или по прямой ссылке список был
     отфильтрован, а чип показывал «Все культуры» и поле поиска было пустым —
     интерфейс врал о том, что на экране. Параметры у Тильды такие:
     tfc_query[<блок>] — запрос, tfc_charact:<id>[<блок>] — культура. */
  (function(){
    var u = new URLSearchParams(location.search), q = '', crop = '';
    u.forEach(function(v, k){
      if (k.indexOf('tfc_query[') === 0) q = v;
      if (k.indexOf('tfc_charact:') === 0 && !crop) crop = v.split(':::')[0];
    });
    if (q && nashe) nashe.value = q;
    if (crop){
      for (var j = 0; j < chips.length; j++){
        chips[j].setAttribute('aria-pressed',
          chips[j].getAttribute('data-crop') === crop ? 'true' : 'false');
      }
    }
  })();

  /* Культурные чипы — только в разделе «Семена» (решение заказчицы
     09.10). Раздел берём из адреса: tfc_storepartnav[4384406801]=<id>,
     у «Семян» id 316570233513. В остальных разделах и в общем списке
     ставим на корень класс sa-kv--nocrops — чипы скрывает CSS. */
  (function(){
    var SEMENA = '316570233513';
    function primenit(){
      var root = document.querySelector('.sa-kv');
      if (!root) return;
      var u = new URLSearchParams(location.search), razdel = '';
      u.forEach(function(v, k){
        if (k.indexOf('tfc_storepartnav[') === 0) razdel = v;
      });
      root.classList.toggle('sa-kv--nocrops', razdel !== SEMENA);
    }
    primenit();
    /* Раздел меняется и перезагрузкой (ссылки в шторке), и AJAX-ом
       (боковой фильтр каталога обновляет адрес без перезагрузки).
       Ловим оба: popstate и опрос адреса. */
    window.addEventListener('popstate', primenit);
    var byl = location.href;
    setInterval(function(){
      if (location.href !== byl){ byl = location.href; primenit(); }
    }, 500);
  })();

  /* Шторка фильтров. Открывается кнопкой «Фильтры», закрывается
     крестиком, кнопкой «Показать товары», щелчком по затемнению и
     клавишей Esc. Пока открыта — страница под ней не прокручивается,
     иначе палец уводит фон вместо списка. */
  (function(){
    var knopka = document.querySelector('.sa-kv__parts');
    var dver   = document.getElementById('sa-kv-dr');
    var ten   = document.getElementById('sa-kv-ov');
    if(!knopka || !dver || !ten) return;
    var bylo = '';
    function otkryt(){
      ten.hidden = false; dver.hidden = false;
      requestAnimationFrame(function(){
        ten.classList.add('is-on'); dver.classList.add('is-on');
      });
      knopka.setAttribute('aria-expanded','true');
      bylo = document.documentElement.style.overflow;
      document.documentElement.style.overflow = 'hidden';
      var first = dver.querySelector('.sa-kv__drx');
      if(first) first.focus();
    }
    function zakryt(){
      ten.classList.remove('is-on'); dver.classList.remove('is-on');
      knopka.setAttribute('aria-expanded','false');
      document.documentElement.style.overflow = bylo;
      setTimeout(function(){ ten.hidden = true; dver.hidden = true; }, 240);
      knopka.focus();
    }
    knopka.addEventListener('click', otkryt);
    ten.addEventListener('click', zakryt);
    dver.querySelector('.sa-kv__drx').addEventListener('click', zakryt);
    dver.querySelector('.sa-kv__drok').addEventListener('click', zakryt);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && !dver.hidden) zakryt();
    });
    /* выбрал культуру — шторка закрывается сама, человек сразу видит товар */
    dver.querySelectorAll('.sa-kv__chip').forEach(function(c){
      c.addEventListener('click', function(){ setTimeout(zakryt, 120); });
    });
  })();
})();

  /* Счётчик позиций. Берём не из разметки, а из самого каталога:
     у Тильды есть скрытое поле с общим числом найденного, а если его
     нет — считаем карточки. Обновляется после поиска и фильтра. */
  (function(){
    var mesto = document.getElementById('sa-kv-count');
    if(!mesto) return;
    function sklonenie(n){
      var o = n % 10, s = n % 100;
      if (o === 1 && s !== 11) return 'позиция';
      if (o >= 2 && o <= 4 && (s < 10 || s >= 20)) return 'позиции';
      return 'позиций';
    }
    /* Считать карточки на странице нельзя: их всегда максимум 36,
       остальное подгружается кнопкой. Поэтому спрашиваем магазин —
       у него есть точное число найденного с учётом раздела, запроса
       и выбранной культуры. Адрес собираем из текущих параметров
       страницы, чтобы счётчик совпадал с тем, что человек видит. */
    var REC = '4384406801', MAGAZIN = '527746460323';
    function adresApi(){
      var p = new URLSearchParams(location.search);
      var u = 'https://store.tildaapi.com/api/getproductslist/?storepartuid=' +
              MAGAZIN + '&recid=' + REC + '&c=' + Date.now() + '&size=1';
      var razdel = p.get('tfc_storepartnav[' + REC + ']');
      if (razdel) u = u.replace('storepartuid=' + MAGAZIN, 'storepartuid=' + razdel);
      var zapros = p.get('tfc_query[' + REC + ']');
      if (zapros) u += '&filters[query]=' + encodeURIComponent(zapros);
      p.forEach(function(v, k){
        var m = k.match(/^tfc_charact:(\d+)\[/);
        if (m) u += '&filters[charact:' + m[1] + ']=' + encodeURIComponent(v);
      });
      return u;
    }
    var posledniy = '';
    function schitat(){
      var u = adresApi();
      if (u.replace(/&c=\d+/, '') === posledniy) return;
      posledniy = u.replace(/&c=\d+/, '');
      fetch(u).then(function(r){ return r.json(); }).then(function(d){
        var n = d && d.total;
        if (!n) return;
        mesto.textContent = n + ' ' + sklonenie(n);
      }).catch(function(){});
    }
    schitat();
    window.addEventListener('load', schitat);
    new MutationObserver(function(){ clearTimeout(window.__saKvT);
      window.__saKvT = setTimeout(schitat, 400); })
      .observe(document.documentElement, {childList:true, subtree:true});
  })();
</script>
