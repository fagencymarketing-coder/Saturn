<!-- Блок «Семена» для вставки в T123 на главной -->
<!-- Адреса товаров подставлены 03.10.2026 из живого каталога,
     список пар «артикул = адрес» — catalogs/product-links.txt,
     подставляет tools/set_product_links.py. Руками href не править:
     slug в адресе не равен артикулу (Tilda пишет «ё» как yo). -->
<style>
.sa-sd{--ink:#141210;--acc:#FF4200;--mut:#766F68;--tile:#F0EDE9;--line:#E7E3DE;
  font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:#fff;padding:80px 0}
.sa-sd *{box-sizing:border-box;margin:0;padding:0}
/* Ширина контента — не жёсткие 1240, а доля окна с потолком. На 1440
   и шире ничего не меняется: 90vw там больше 1240, работает потолок.
   А на узком десктопе (ноутбук, масштаб Windows 150%) контент
   переставал быть «колонкой на странице» и занимал почти весь экран —
   отсюда и ощущение «всё крупное». Теперь поля растут вместе с окном.
   Заказчик 04.10.2026. */
.sa-sd__in{max-width:min(1240px,90vw);margin:0 auto;padding:0 20px}
.sa-sd__top{display:flex;align-items:flex-start;gap:24px}
.sa-sd__kicker{display:inline-flex;align-items:center;gap:12px;font-size:var(--sa-kick);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mut);line-height:1}
/* оранжевая риска перед надзаголовком — есть на утверждённом холсте
   у каждой секции, у нас её не было ни в одной. Решение заказчика 03.10.2026. */
.sa-sd__kicker::before{content:"";flex:0 0 auto;width:24px;height:2px;
  background:#FF4200}
/* Кегль — из общей шкалы сайта, см. :root в коде HEAD. */
.sa-sd__h{font-size:var(--sa-h2);font-weight:800;line-height:var(--sa-h2-lh);margin-top:16px;letter-spacing:-.01em}
.sa-sd__all{margin-left:auto;flex:0 0 auto;margin-top:22px;
  display:inline-flex;align-items:center;gap:6px;height:52px;padding:0 22px;
  border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);
  font-size:var(--sa-body);font-weight:700;white-space:nowrap}
.sa-sd__all i{font-style:normal;color:var(--mut);font-weight:700}
.sa-sd__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:48px}
.sa-sd__card{display:flex;flex-direction:column;background:#fff;
  border:1px solid var(--line);transition:transform var(--sa-t) var(--sa-ease),
    box-shadow var(--sa-t) var(--sa-ease),border-color var(--sa-t) var(--sa-ease),
    color var(--sa-t) var(--sa-ease);
  border-radius:22px;padding:16px;text-decoration:none;color:inherit}
.sa-sd__ph{position:relative;background:var(--tile);border-radius:12px;aspect-ratio:353/264;
  overflow:hidden}
.sa-sd__ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sa-sd__body{padding:20px 6px 6px;display:flex;flex-direction:column;gap:8px}
.sa-sd__name{font-size:var(--sa-h3);font-weight:700;line-height:1.25}
.sa-sd__sig{font-size:var(--sa-small);font-weight:400;line-height:1.4;color:var(--mut)}
.sa-sd__y{display:flex;align-items:baseline;gap:4px}
.sa-sd__y i{font-style:normal;font-size:var(--sa-small);font-weight:400;color:var(--mut)}
.sa-sd__y b{font-size:24px;font-weight:700;line-height:1}
@media (hover:hover){
  .sa-sd__all:hover{border-color:var(--ink)}
  .sa-sd__card:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,18,16,.08)}
  .sa-sd__card:hover .sa-sd__name{color:var(--acc)}
}
@media (max-width:1023px){
  .sa-sd{padding:64px 0}
  .sa-sd__in{padding:0 32px}
  .sa-sd__top{display:block}
  .sa-sd__h{line-height:var(--sa-h2-lh)}
  .sa-sd__all{margin-left:0;margin-top:20px}
  .sa-sd__grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:32px}
  .sa-sd__ph{aspect-ratio:262/196}
  .sa-sd__name{font-size:16px;line-height:20px}
  .sa-sd__y b{font-size:22px}
}
@media (max-width:767px){
  .sa-sd{padding:52px 0}
  .sa-sd__in{padding:0 20px}
  /* «Все семена 25 →» на холсте стоит под сеткой, а не под заголовком —
     обёртка .sa-sd__top на телефоне растворяется, чтобы кнопку можно было
     переставить, не трогая разметку. */
  .sa-sd__in{display:flex;flex-direction:column}
  .sa-sd__top{display:contents}
  .sa-sd__top>div:first-child{order:1}
  .sa-sd__grid{order:2;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:28px}
  .sa-sd__all{order:3;display:flex;justify-content:center;width:100%;margin-top:28px}
  /* B9 05.10: фото 16:10 вместо почти квадрата — три сорта умещаются в полтора экрана */
  .sa-sd__ph{aspect-ratio:16/10;height:auto}
  .sa-sd__name{font-size:17px;line-height:21px}
  .sa-sd__sig{font-size:13px;line-height:18px}
  .sa-sd__y b{font-size:24px}
}

/* 05.10: блок целиком на экране ≈1280×593 — высота фото считается от окна */
@media (min-width:1024px){
  .sa-sd{padding:clamp(28px,6vh,80px) 0}
  .sa-sd__grid{margin-top:clamp(20px,3.5vh,48px)}
  .sa-sd__ph{aspect-ratio:auto;height:clamp(130px,calc(100dvh - 460px),267px)}
}
</style>

        <div class="sa-sd__body">
          <div class="sa-sd__name">Ampir 25 Express</div>
